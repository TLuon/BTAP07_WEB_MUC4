<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Quản lý Sản phẩm</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 mb-0 text-gray-800">
                <i class="fas fa-edit text-primary me-2"></i>
                <span th:text="${product.productId != 0} ? 'Cập nhật Sản phẩm' : 'Thêm mới Sản phẩm'"></span>
            </h2>
            <a href="/th/admin/products" class="btn btn-secondary shadow-sm">
                <i class="fas fa-arrow-left fa-sm text-white-50 me-1"></i> Quay lại danh sách
            </a>
        </div>

        <div class="card shadow mb-4" style="max-width: 800px; margin: 0 auto;">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Thông tin chi tiết</h6>
            </div>
            <div class="card-body">
                <form th:action="@{/th/admin/products/save}" method="post" th:object="${product}" enctype="multipart/form-data">
                    <input type="hidden" th:field="*{productId}" />
                    
                    <div class="mb-3">
                        <label for="productName" class="form-label fw-bold">Tên Sản Phẩm</label>
                        <input type="text" class="form-control" id="productName" th:field="*{productName}" required placeholder="Nhập tên sản phẩm...">
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label fw-bold">Danh mục</label>
                        <select class="form-select form-control" id="category" th:field="*{categoryId}" required>
                            <option value="" disabled selected>-- Chọn Danh Mục --</option>
                            <option th:each="cat : ${categories}" th:value="${cat.categoryId}" th:text="${cat.categoryname}"></option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="price" class="form-label fw-bold">Giá (VNĐ)</label>
                            <input type="number" class="form-control" id="price" th:field="*{price}" required min="0" step="1000" placeholder="0">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="stock" class="form-label fw-bold">Số lượng (Tồn kho)</label>
                            <input type="number" class="form-control" id="stock" th:field="*{stock}" required min="0" placeholder="0">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label fw-bold">Mô tả</label>
                        <textarea class="form-control" id="description" th:field="*{description}" rows="3" placeholder="Nhập mô tả sản phẩm..."></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Trạng thái</label>
                        <div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="status" id="status1" value="1" th:field="*{status}">
                                <label class="form-check-label text-success" for="status1">Còn hàng (Hiển thị)</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="status" id="status0" value="0" th:field="*{status}">
                                <label class="form-check-label text-danger" for="status0">Hết hàng (Ẩn)</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="imageFiles" class="form-label fw-bold">Hình ảnh (Có thể chọn nhiều ảnh)</label>
                        <input type="file" class="form-control" id="imageFiles" name="imageFiles" accept="image/*" multiple onchange="previewImages(this)">
                        
                        <div class="mt-3">
                            <p class="text-muted small mb-1">Ảnh hiện tại:</p>
                            <div class="border rounded p-3 bg-light shadow-sm d-flex flex-wrap gap-2" id="imagePreviewContainer">
                                <th:block th:if="${product.imagePaths != null && !product.imagePaths.isEmpty()}">
                                    <div th:each="img : ${product.imagePaths}" class="position-relative">
                                        <img th:src="@{'/uploads/' + ${img}}" 
                                             class="img-thumbnail border-0 shadow-sm" 
                                             style="width: 120px; height: 120px; object-fit: cover;">
                                    </div>
                                </th:block>
                                <th:block th:unless="${product.imagePaths != null && !product.imagePaths.isEmpty()}">
                                    <div class="text-center w-100 py-3 text-muted">
                                        <i class="fas fa-image fa-2x mb-2"></i>
                                        <p class="mb-0 small">Chưa có hình ảnh nào</p>
                                    </div>
                                </th:block>
                            </div>
                        </div>
                    </div>

                    <hr>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fas fa-save me-1"></i> Lưu lại
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            function previewImages(input) {
                var container = document.getElementById('imagePreviewContainer');
                
                if (input.files && input.files.length > 0) {
                    // Xóa ảnh cũ (hoặc icon placeholder) để hiển thị ảnh mới chọn
                    container.innerHTML = '';
                    
                    Array.from(input.files).forEach(file => {
                        var reader = new FileReader();
                        reader.onload = function(e) {
                            var div = document.createElement('div');
                            div.className = 'position-relative';
                            div.innerHTML = `<img src="${e.target.result}" class="img-thumbnail border-0 shadow-sm" style="width: 120px; height: 120px; object-fit: cover;">`;
                            container.appendChild(div);
                        }
                        reader.readAsDataURL(file);
                    });
                }
            }
        </script>
    </div>
</body>
</html>
