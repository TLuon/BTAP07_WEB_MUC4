<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Quản lý Category</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 mb-0 text-gray-800">
                <i class="fas fa-edit text-primary me-2"></i>
                <span th:text="${category.categoryId != 0} ? 'Cập nhật Danh mục' : 'Thêm mới Danh mục'"></span>
            </h2>
            <a href="/th/admin/categories" class="btn btn-secondary shadow-sm">
                <i class="fas fa-arrow-left fa-sm text-white-50 me-1"></i> Quay lại danh sách
            </a>
        </div>

        <div class="card shadow mb-4" style="max-width: 800px; margin: 0 auto;">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Thông tin chi tiết</h6>
            </div>
            <div class="card-body">
                <form th:action="@{/th/admin/categories/save}" method="post" th:object="${category}" enctype="multipart/form-data">
                    <input type="hidden" th:field="*{categoryId}" />
                    
                    <div class="mb-3">
                        <label for="categoryname" class="form-label fw-bold">Tên Danh Mục</label>
                        <input type="text" class="form-control" id="categoryname" th:field="*{categoryname}" required placeholder="Nhập tên danh mục...">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Trạng thái</label>
                        <div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="status" id="status1" value="1" th:field="*{status}">
                                <label class="form-check-label text-success" for="status1">Hoạt động</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="status" id="status0" value="0" th:field="*{status}">
                                <label class="form-check-label text-danger" for="status0">Đã khóa</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="imageFile" class="form-label fw-bold">Hình ảnh</label>
                        <input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/*" onchange="previewImage(this)">
                        
                        <div class="mt-3">
                            <p class="text-muted small mb-1">Ảnh hiện tại:</p>
                            <div class="border rounded p-2 d-inline-block bg-light shadow-sm" style="min-width: 150px; text-align: center;">
                                <img id="imagePreview" 
                                     th:src="${category.images != null && !category.images.isEmpty() ? '/uploads/' + category.images : 'data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22150%22%20height%3D%22150%22%20viewBox%3D%220%200%20150%20150%22%3E%3Crect%20width%3D%22150%22%20height%3D%22150%22%20fill%3D%22%23f8f9fa%22%2F%3E%3Cpath%20d%3D%22M75%2045c-16.56%200-30%2013.44-30%2030s13.44%2030%2030%2030%2030-13.44%2030-30-13.44-30-30-30zm0%2054c-13.23%200-24-10.77-24-24s10.77-24%2024-24%2024%2010.77%2024%2024-10.77%2024-24%2024z%22%20fill%3D%22%23dee2e6%22%2F%3E%3C%2Fsvg%3E'}" 
                                     alt="Preview" 
                                     class="img-thumbnail border-0 bg-transparent" 
                                     style="max-height: 150px; object-fit: cover;">
                            </div>
                        </div>
                    </div>

                    <hr>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fas fa-save me-1"></i> Lưu lại
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            function previewImage(input) {
                var preview = document.getElementById('imagePreview');
                if (input.files && input.files[0]) {
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        preview.src = e.target.result;
                    }
                    reader.readAsDataURL(input.files[0]);
                }
            }
        </script>
    </div>
</body>
</html>
