<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>Danh sách Category</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 mb-0 text-gray-800"><i class="fas fa-list-alt text-primary me-2"></i> Danh sách Category</h2>
            <a href="/th/admin/categories/add" class="btn btn-primary shadow-sm">
                <i class="fas fa-plus fa-sm text-white-50 me-1"></i> Thêm mới
            </a>
        </div>

        <div class="card shadow mb-4">
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                <h6 class="m-0 font-weight-bold text-primary">Bộ lọc tìm kiếm</h6>
            </div>
            <div class="card-body">
                <form action="/th/admin/categories" method="get" class="row g-3">
                    <div class="col-md-6">
                        <div class="input-group">
                            <input type="text" class="form-control" name="name" th:value="${name}" placeholder="Nhập tên category cần tìm...">
                            <button class="btn btn-outline-primary" type="submit">
                                <i class="fas fa-search"></i> Tìm
                            </button>
                            <a href="/th/admin/categories" class="btn btn-outline-secondary">
                                Xóa lọc
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow mb-4">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th width="10%">ID</th>
                                <th width="20%">Hình ảnh</th>
                                <th width="35%">Tên Category</th>
                                <th width="15%">Trạng thái</th>
                                <th width="20%" class="text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${categoryPage.content}">
                                <td th:text="${cat.categoryId}">1</td>
                                <td>
                                    <img th:if="${cat.images != null && !cat.images.isEmpty()}" 
                                         th:src="@{'/uploads/' + ${cat.images}}" 
                                         alt="Category Image" 
                                         style="height: 50px; width: 50px; object-fit: cover; border-radius: 8px;"
                                         onerror="this.outerHTML='<span class=\'badge bg-light text-muted border p-3\'><i class=\'fas fa-image fa-lg\'></i></span>'"/>
                                    <span th:unless="${cat.images != null && !cat.images.isEmpty()}" class="badge bg-light text-muted border p-3"><i class="fas fa-image fa-lg"></i></span>
                                </td>
                                <td class="fw-semibold text-dark" th:text="${cat.categoryname}">Tên danh mục</td>
                                <td>
                                    <span th:if="${cat.status == 1}" class="badge bg-success rounded-pill px-3">Hoạt động</span>
                                    <span th:unless="${cat.status == 1}" class="badge bg-danger rounded-pill px-3">Đã khóa</span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{'/th/admin/categories/edit/' + ${cat.categoryId}}" class="btn btn-sm btn-info text-white me-2">
                                        <i class="fas fa-edit"></i> Sửa
                                    </a>
                                    <a href="javascript:void(0);" th:onclick="'confirmDelete(' + ${cat.categoryId} + ')'" class="btn btn-sm btn-danger">
                                        <i class="fas fa-trash-alt"></i> Xóa
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${categoryPage.totalElements == 0}">
                                <td colspan="5" class="text-center py-4 text-muted">
                                    <i class="fas fa-inbox fa-3x mb-3 d-block"></i>
                                    Không có dữ liệu
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Phân trang -->
                <div class="d-flex justify-content-between align-items-center mt-4" th:if="${categoryPage.totalPages > 0}">
                    <div class="text-muted small">
                        Hiển thị <span class="fw-bold" th:text="${categoryPage.numberOfElements}"></span> / <span class="fw-bold" th:text="${categoryPage.totalElements}"></span> kết quả
                    </div>
                    <nav aria-label="Page navigation">
                        <ul class="pagination pagination-sm mb-0">
                            <!-- Nút Prev -->
                            <li class="page-item" th:classappend="${categoryPage.first ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/th/admin/categories(name=${name}, page=${categoryPage.number})}" aria-label="Previous">
                                    <span aria-hidden="true">&laquo;</span>
                                </a>
                            </li>
                            <!-- Số trang -->
                            <li th:each="pageNumber : ${pageNumbers}" class="page-item" th:classappend="${pageNumber == categoryPage.number + 1 ? 'active' : ''}">
                                <a class="page-link" th:href="@{/th/admin/categories(name=${name}, page=${pageNumber})}" th:text="${pageNumber}">1</a>
                            </li>
                            <!-- Nút Next -->
                            <li class="page-item" th:classappend="${categoryPage.last ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/th/admin/categories(name=${name}, page=${categoryPage.number + 2})}" aria-label="Next">
                                    <span aria-hidden="true">&raquo;</span>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

        <script>
            function confirmDelete(id) {
                Swal.fire({
                    title: 'Bạn có chắc chắn?',
                    text: "Dữ liệu sau khi xóa sẽ không thể khôi phục!",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#6c757d',
                    confirmButtonText: 'Vâng, xóa nó!',
                    cancelButtonText: 'Hủy'
                }).then((result) => {
                    if (result.isConfirmed) {
                        window.location.href = '/th/admin/categories/delete/' + id;
                    }
                })
            }
        </script>
    </div>
</body>
</html>
